<sc-if value="{{isLock}}">
<div data-alpha-development-lock-screen class="fadein" style="position: absolute; inset: 0; z-index: 80; background: var(--bg); display: flex; flex-direction: column; align-items: center">
  <svg class="i" viewBox="0 0 24 24" style="margin-top: 62px; width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.lock}}"></path></svg>
  <div data-alpha-lock-clock class="serif" style="font-size: 132px; line-height: .9; margin-top: 44px; letter-spacing: -.035em">{{clock}}</div>
  <div style="margin-top: 16px; color: var(--mut); font-size: 15px">{{dateStr}}</div>
  <div style="position: absolute; bottom: 58px; left: 34px; right: 34px; display: flex; justify-content: space-between; align-items: center">
    <sc-if value="{{externalVoiceInvocation}}"><button aria-label="Talk to {{name}}" onPointerDown="{{chatControlPointer}}" onClick="{{startVoice}}" style="width: 58px; height: 58px; border-radius: 29px; background: var(--s2); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.mic}}"></path></svg></button></sc-if>
    <button aria-label="Unlock with fingerprint" onClick="{{unlock}}" style="width: 76px; height: 76px; border-radius: 38px; box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; color: var(--acct)"><svg class="i" viewBox="0 0 24 24" style="width: 34px; height: 34px"><path d="{{ic.fp}}"></path></svg></button>
    <div aria-hidden="true" style="width: 58px; height: 58px"></div>
  </div>
</div>
</sc-if>


<sc-if value="{{isOff}}">
<button aria-label="Wake" onClick="{{wake}}" style="position: absolute; inset: 0; z-index: 88; background: var(--alpha-black)"></button>
</sc-if>


<sc-if value="{{isBoot}}">
<div style="position: absolute; inset: 0; z-index: 90; background: var(--alpha-black); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px">
  <img src="./logo.svg" alt="Alpha Compute" style="width: 250px; height: auto; opacity: {{bootMark}}; transform: translateY({{bootMarkY}}px); transition: opacity 1.1s cubic-bezier(.83,0,.17,1), transform 1.1s cubic-bezier(.83,0,.17,1)">
  <div style="opacity: {{bootTag}}; transition: opacity .9s; color: var(--alpha-gray-8f); font-size: 14px">Powered by elizaOS</div>
</div>
</sc-if>


<sc-if value="{{showStatus}}">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; z-index: 98; pointer-events: none; font-size: 13.5px; font-weight: 600; color: {{sbColor}}; transition: color .3s">
  <span>{{clock}}</span>
  <span style="display: flex; gap: 7px; align-items: center">
    <sc-if value="{{micLive}}"><span style="width: 7px; height: 7px; border-radius: 4px; background: var(--alpha-ok-green)"></span></sc-if>
    <sc-if value="{{sbWifi}}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; "><path d="{{ic.wifi}}"></path></svg></sc-if>
    <sc-if value="{{sbPlane}}"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; "><path d="{{ic.plane}}"></path></svg></sc-if>
    <span style="display: flex; align-items: flex-end; gap: 1.5px; height: 12px"><span style="width: 3px; height: 4px; background: currentColor; border-radius: 1px"></span><span style="width: 3px; height: 6px; background: currentColor; border-radius: 1px"></span><span style="width: 3px; height: 9px; background: currentColor; border-radius: 1px"></span><span style="width: 3px; height: 12px; background: currentColor; border-radius: 1px; opacity: .35"></span></span>
    <span style="display: flex; align-items: center; gap: 1px"><span style="width: 22px; height: 11px; border-radius: 3px; border: 1.3px solid currentColor; padding: 1.2px; box-sizing: border-box; display: flex"><span style="width: 78%; background: currentColor; border-radius: 1px"></span></span><span style="width: 2px; height: 4px; background: currentColor; border-radius: 0 1px 1px 0"></span></span>
  </span>
</div>
</sc-if>
