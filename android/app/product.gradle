// Alpha product configuration applied by the generated host (android/consumer-host.json,
// appScripts). The upstream generator owns SDK, dependencies, variants, signing,
// version and test-mocks policy; this file holds only Alpha's Gradle-time product
// inputs and admission: App Links, update manifest, voice and embedding hosts.
// There is one runtime profile. Every build packages on-device speech and local embeddings; the
// renderer chooses Cloud, provider or on-device speech at run time. The resident agent still
// receives ELIZA_RUNTIME_PROFILE=native (upstream's local-embeddings route).
if (project.hasProperty('ELIZA_RUNTIME_PROFILE') || project.hasProperty('ELIZA_LOCAL_EMBEDDINGS'))
 throw new GradleException('There is one runtime profile now; remove ELIZA_RUNTIME_PROFILE and ELIZA_LOCAL_EMBEDDINGS')
def unpackagedRuntime = project.findProperty('ELIZA_ALLOW_UNPACKAGED_RUNTIME')?.toString() == '1'
// Upstream switch (vendor/eliza/packages/app/scripts/dev-ui.ts): the generator attaches test-only
// sources to DEBUG variants when it is exactly "1".
def testMocksRaw = project.findProperty('ELIZA_DEV_ALLOW_TEST_MOCKS') ?: System.getenv('ELIZA_DEV_ALLOW_TEST_MOCKS')
// Debug ABIs use the same explicit target as resident staging (scripts/stage-local-agent-runtime.ts);
// dependency ABI flags do not filter the app. android/consumer-host.json therefore declares no debug
// abiFilters: the default stays arm64-v8a + x86_64, and the Android Bun producer admits ARM64 only.
def runtimeAbisRaw = project.findProperty('ELIZA_ANDROID_TARGET_ABIS')
if (runtimeAbisRaw == null) runtimeAbisRaw = System.getenv('ELIZA_ANDROID_TARGET_ABIS')
def runtimeAbis = runtimeAbisRaw == null ? ['arm64-v8a', 'x86_64'] : runtimeAbisRaw.toString().split(',', -1).collect { it.trim() }
if (!runtimeAbis || runtimeAbis.toSet().size() != runtimeAbis.size() || runtimeAbis.any { !(it in ['arm64-v8a', 'x86_64']) })
 throw new GradleException('Invalid ELIZA_ANDROID_TARGET_ABIS')
def androidBunTarget = project.findProperty('ELIZA_ANDROID_BUN_TARGET') ?: System.getenv('ELIZA_ANDROID_BUN_TARGET') ?: 'linux-musl'
if (!(androidBunTarget in ['android', 'linux-musl']) || androidBunTarget == 'android' && runtimeAbis != ['arm64-v8a'])
 throw new GradleException('Android Bun requires the explicit arm64-v8a target')
def envValue = { String name -> def value = System.getenv(name); value == null || value.trim().isEmpty() ? null : value.trim() }
apply from: file('cloud-deployment.generated.gradle')
def cloudWebHost = alphaCloudWebHosts.production
def stagingCloudWebHost = alphaCloudWebHosts.staging
// Verified App Links return for Cloud delegation, the in-app Cloud sign-in and the Google
// Workspace consent return (GoogleWorkspaceReturn) at the configured production web host.
// AndroidManifest.xml declares the exact sign-in and Google callback paths. Publish the
// assetlinks.json rendered by scripts/render-assetlinks.ts on that configured host.
def appLinkHostRaw = project.findProperty('ELIZAOS_APP_LINK_HOST') ?: envValue('ELIZAOS_APP_LINK_HOST')
def appLinkHost = appLinkHostRaw == null || appLinkHostRaw.toString().trim().isEmpty() ? cloudWebHost : appLinkHostRaw.toString().trim()
if (appLinkHost && !(appLinkHost ==~ /(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{0,61}[a-z0-9]/))
 throw new GradleException('ELIZAOS_APP_LINK_HOST must be a lower-case DNS host name without scheme, port or path')
if (appLinkHost && appLinkHost != cloudWebHost)
 throw new GradleException('ELIZAOS_APP_LINK_HOST must match the production web host in scripts/cloud-deployment-policy.ts')
// One-tap app update (AlphaDevicePlugin checkForUpdate): the one HTTPS update manifest, app.config.json updateManifestUrl.
def updateManifestUrl = new groovy.json.JsonSlurper().parse(file('../../app.config.json')).updateManifestUrl
if (!(updateManifestUrl instanceof String) || new URI(updateManifestUrl).scheme != 'https' || !new URI(updateManifestUrl).host)
 throw new GradleException('app.config.json updateManifestUrl must be an HTTPS URL')
// An explicitly declared, private test artifact can use an expiring capability.
// Never put that capability in source, Gradle arguments, diagnostics or build records.
def updateChannel = System.getenv('ALPHA_UPDATE_CHANNEL') ?: 'public'
def privateUpdateFile = System.getenv('ALPHA_PRIVATE_UPDATE_MANIFEST_FILE')
def privateUpdateDigest = System.getenv('ALPHA_PRIVATE_UPDATE_MANIFEST_SHA256')
if (!(updateChannel in ['public','private-qa']) || updateChannel == 'public' && (privateUpdateFile || privateUpdateDigest))
 throw new GradleException('Update channel input refused')
if (updateChannel == 'private-qa') {
 try {
  if (unpackagedRuntime || testMocksRaw?.toString() == '1' || !privateUpdateFile || !(privateUpdateDigest ==~ /[a-f0-9]{64}/)) throw new Exception()
  def input = java.nio.file.Paths.get(privateUpdateFile)
  def noFollow = java.nio.file.LinkOption.NOFOLLOW_LINKS
  if (!input.isAbsolute() || java.nio.file.Files.isSymbolicLink(input)) throw new Exception()
  if (input.toRealPath().startsWith(file('../..').toPath().toRealPath())) throw new Exception()
  def before = java.nio.file.Files.readAttributes(input, java.nio.file.attribute.BasicFileAttributes, noFollow)
  def mode = java.nio.file.Files.getAttribute(input, 'unix:mode', noFollow) as int
  def uid = java.nio.file.Files.getAttribute(input, 'unix:uid', noFollow) as long
  if (!before.isRegularFile() || before.size() < 1 || before.size() > 2048 || (mode & 07777) != 0600 || uid != new com.sun.security.auth.module.UnixSystem().getUid()) throw new Exception()
  byte[] bytes
  java.nio.channels.FileChannel.open(input, java.nio.file.StandardOpenOption.READ, noFollow).withCloseable { channel ->
   def buffer = java.nio.ByteBuffer.allocate(2049)
   while (buffer.hasRemaining() && channel.read(buffer) > 0) {}
   bytes = java.util.Arrays.copyOf(buffer.array(), buffer.position())
  }
  def after = java.nio.file.Files.readAttributes(input, java.nio.file.attribute.BasicFileAttributes, noFollow)
  if (!after.isRegularFile() || before.fileKey() != after.fileKey() || before.size() != after.size() || before.lastModifiedTime() != after.lastModifiedTime() || bytes.length > 2048 || bytes.any { (it & 255) < 33 || (it & 255) > 126 }) throw new Exception()
  if (java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() != privateUpdateDigest) throw new Exception()
  def candidate = new String(bytes, java.nio.charset.StandardCharsets.US_ASCII)
  def uri = new URI(candidate)
  if (uri.scheme != 'https' || uri.rawAuthority != 'storage.googleapis.com' || uri.fragment != null || !(uri.rawPath ==~ /\/alpha-aosp-lab-20261024-private-apks\/update-qa\/[a-f0-9]{32}\/alpha-update\.json/) || !uri.rawQuery) throw new Exception()
  def pairs = uri.rawQuery.split('&').collect { it.split('=',2) }
  // Match the Node preflight for gcloud's lowercase keys without rewriting the signed URL.
  def query = pairs.collectEntries { [(java.net.URLDecoder.decode(it[0],'UTF-8').toLowerCase(Locale.ROOT)):it.length == 2 ? java.net.URLDecoder.decode(it[1],'UTF-8') : ''] }
  if (query.size() != pairs.size()) throw new Exception()
  if (query['x-goog-algorithm'] != 'GOOG4-RSA-SHA256' || !(query['x-goog-expires'] ==~ /[0-9]+/) || new BigInteger(query['x-goog-expires']) < 300 || new BigInteger(query['x-goog-expires']) > 86400) throw new Exception()
  updateManifestUrl = candidate
 } catch (Exception ignored) { throw new GradleException('Update channel input refused') }
}
def updateManifestSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(updateManifestUrl.getBytes('UTF-8')).encodeHex().toString()

android {
 buildTypes {
  debug {
   // Match the resident runtime and reviewed native libraries; dependencies may also ship 32-bit ABIs.
   ndk { abiFilters.addAll(runtimeAbis) }
  }
 }
 defaultConfig {
  manifestPlaceholders.put('appLinkHost', appLinkHost)
  manifestPlaceholders.put('stagingCloudWebHost', stagingCloudWebHost)
  manifestPlaceholders.put('alphaUpdateChannel', updateChannel)
  manifestPlaceholders.put('alphaUpdateManifestSha256', 'sha256:' + updateManifestSha256)
  // Constant: the value the resident agent is launched with (AlphaLocalAgentPlugin).
  buildConfigField 'String', 'ELIZA_RUNTIME_PROFILE', '"native"'
  // The verified App Link host this build declares (ELIZAOS_APP_LINK_HOST), or "" when none.
  buildConfigField 'String', 'ELIZAOS_APP_LINK_HOST', "\"${appLinkHost}\""
  buildConfigField 'String', 'ALPHA_UPDATE_MANIFEST_URL', "\"${updateManifestUrl}\""
  // The shared voice loader configures Phonon-2's in-tree ggml backend.
  // Decode threads may be supplied by the host; empty means one per big core.
  def elizaAsrThreads = (System.getenv('ELIZA_ASR_THREADS') ?: '').trim()
  buildConfigField 'String', 'ELIZA_ASR_THREADS', "\"${elizaAsrThreads ==~ /[0-9]{1,2}/ ? elizaAsrThreads : ''}\""
  // The source commit each voice latency trial records (issue #395, shared VoiceLatencyProbe via AlphaApplication).
  // A tree with tracked changes is recorded as dirty; the aggregator never accepts dirty trials.
  def sourceGit = { List<String> command ->
   try { providers.exec { commandLine(['git', '-C', rootProject.projectDir.parentFile.absolutePath] + command) }.standardOutput.asText.get().trim() }
   catch (Exception unavailable) { null }
  }
  def elizaSourceCommit = sourceGit(['rev-parse', 'HEAD']) ?: ''
  def elizaSourceStatus = sourceGit(['status', '--porcelain', '--untracked-files=no'])
  buildConfigField 'String', 'ELIZA_SOURCE_COMMIT', "\"${elizaSourceCommit ==~ /[0-9a-f]{40}/ ? elizaSourceCommit : 'unknown'}\""
  buildConfigField 'boolean', 'ELIZA_SOURCE_DIRTY', elizaSourceStatus == null || !elizaSourceStatus.isEmpty() ? 'true' : 'false'
 }
}

// The shared bionic host is packaged only from the reviewed consumer artifact and BGE pin.
def verifyEmbeddingHost = tasks.register('verifyEmbeddingHost', Exec) {
 workingDir rootProject.projectDir.parentFile
 def args = ['node', 'scripts/stage-embedding-host.ts', '--verify']
 if (unpackagedRuntime) args += '--allow-unpackaged-runtime'
 commandLine args
}
tasks.named('preBuild').configure { dependsOn verifyEmbeddingHost }

// The staged Google host must match the current product sources before it is packaged.
def verifyNativeGoogleHost = tasks.register('verifyNativeGoogleHost', Exec) {
 onlyIf { !unpackagedRuntime && testMocksRaw?.toString() != '1' }
 workingDir rootProject.projectDir.parentFile
 commandLine 'node', 'scripts/runtime-profile.ts', '--verify-native'
}
tasks.named('preBuild').configure { dependsOn verifyNativeGoogleHost }

// On-device voice: the shared paradee-voice library (:local-speech) links libelizainference but does
// not package it; the app packages its resident host's engine, so the two must be identical bytes.
// Staged voice outputs must also be the bytes android/voice-host/qualified-voice-host.json records.
// The listener APK packages its own verified copy of the engine.
// One explicit selection controls JNI compilation and the same integrity checks.
def selectedParadeeAbis = project.findProperty('elizaParadeeAbis')?.toString()?.split(',', -1)?.toList() ?: ['arm64-v8a', 'x86_64']
if (!selectedParadeeAbis || selectedParadeeAbis.toSet().size() != selectedParadeeAbis.size() || selectedParadeeAbis.any { !(it in ['arm64-v8a', 'x86_64']) }) throw new GradleException('Invalid elizaParadeeAbis')
def paradeeAbiArgs = selectedParadeeAbis.collectMany { ['--abi', it] }
def verifyParadeeAppLinkage = tasks.register('verifyParadeeAppLinkage', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine(['node', 'scripts/paradee-runtime.ts', '--app-linkage'] + paradeeAbiArgs + (unpackagedRuntime ? ['--allow-absent'] : []))
}
def verifyVoiceHost = tasks.register('verifyVoiceHost', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine(['node', 'scripts/voice-host.ts', '--verify'] + paradeeAbiArgs + (unpackagedRuntime ? ['--allow-absent'] : []))
}
tasks.named('preBuild').configure { dependsOn verifyParadeeAppLinkage, verifyVoiceHost }

// Reject stale synced renderer assets: a renderer built for the removed Cloud profile names it.
def verifyRuntimeWebProfile = tasks.register('verifyRuntimeWebProfile') {
 doLast {
  def flagsFile = file('src/main/assets/public/build-flags.json')
  if (!flagsFile.isFile()) throw new GradleException('Synced web build flags missing')
  def flags = new groovy.json.JsonSlurper().parse(flagsFile)
  if (flags.runtimeProfile != null) throw new GradleException('Synced web assets name a runtime profile; rebuild and sync the renderer')
 }
}
tasks.named('preBuild').configure { dependsOn verifyRuntimeWebProfile }
