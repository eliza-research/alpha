apply plugin: 'com.android.application'
// Ordinary-UID private socket probe for resident CI (scripts/ci/build-private-peer.py). Never a dependency of :app.
android {
 namespace 'ai.alphacompute.alphaphone.peerfixture'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig { applicationId 'ai.alphacompute.alphaphone.peerfixture'; minSdk 29; targetSdk rootProject.ext.targetSdkVersion; versionCode 1; versionName 'fixture-1' }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
 // Only debug artifacts are admitted. Never distribute this test helper.
 variantFilter { variant -> if (variant.buildType.name != 'debug') variant.setIgnore(true) }
}
