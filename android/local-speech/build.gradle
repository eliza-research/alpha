def paradeeAbiArgs = ['arm64-v8a', 'x86_64'].collectMany { ['--abi', it] }
// Shared native speech API and build policy come from the exact reviewed pin.
def preparedSpeech = new groovy.json.JsonSlurper().parseText(providers.exec {
 workingDir rootProject.projectDir.parentFile
 commandLine 'bun', 'scripts/prepare-patched-native.ts'
}.standardOutput.asText.get())
def paradee = new File(preparedSpeech.root.toString(), 'plugins/plugin-local-inference/native/android')
if (!paradee.isDirectory()) paradee = file('../../vendor/eliza/plugins/plugin-local-inference/native/android')
if (!paradee.isDirectory()) {
 ext.elizaSpeechSourceDir = file('../../vendor/eliza/packages/app/platforms/android/local-speech')
 apply from: new File(ext.elizaSpeechSourceDir, 'consumer.gradle')
} else {
 // Alpha's AlphaVoiceCloud bridge subclasses the shared LocalSpeechBridgePlugin.
 ext.elizaSpeechBridgeCapacitor = 'true'
 ext.elizaParadeeSourceDir = paradee
 ext.elizaParadeeNativeDir = file('../../.eliza/paradee-voice/native')
 // The nested engine header is authenticated by verifySpeechInputs, outside the patched Java tree.
 ext.elizaParadeeFfiIncludeDir = file('../../vendor/eliza/plugins/plugin-local-inference/native/llama.cpp/tools/omnivoice/include')
 ext.elizaParadeePackageInference = false
 apply from: new File(paradee, 'consumer.gradle')
 def verifySpeechInputs = tasks.register('verifySpeechInputs', Exec) {
  workingDir rootProject.projectDir.parentFile
  commandLine(['bun', 'scripts/paradee-runtime.ts'] + paradeeAbiArgs)
 }
 tasks.named('preBuild').configure { dependsOn verifySpeechInputs }
}

// Shared relay compiles against the same pinned OkHttp API implemented by the app.
dependencies { compileOnly 'com.squareup.okhttp3:okhttp:5.3.2' }
