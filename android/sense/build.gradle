// Product identities stay here; capture, consent and lifecycle are owned upstream.
def identity = new groovy.json.JsonSlurper().parse(file('../../app.config.json'))
def preparedSense = new groovy.json.JsonSlurper().parseText(providers.exec {
 workingDir rootProject.projectDir.parentFile
 commandLine 'bun', 'scripts/prepare-patched-native.ts'
}.standardOutput.asText.get())
ext.elizaSenseSourceDir = new File(preparedSense.root.toString(), 'packages/app/platforms/android/sense')
ext.elizaSenseProfile = file('../aosp/pixel10a-composition.json')
ext.elizaSenseSpeechProject = ':sense-speech'
ext.elizaSenseVersionCode = identity.versionCode
ext.elizaSenseVersionName = identity.version
apply from: new File(elizaSenseSourceDir, 'consumer.gradle')
