name: release

# Alpha's launcher release (spec/release/index.md, `pnpm release` in apps/app). A branch push builds
# an unsigned candidate, mirrors it privately with its signing plan, and stops. The release
# owner reads the plan and dispatches this workflow with the candidate's run and the plan's digest: the
# protected `release` environment signs exactly that plan's APK with Alpha's one key, delivers it with a
# receipt, records its voice qualification, and publishes the APK first, its anonymous download verified,
# before the manifest phones read moves. The run's ledger travels with the candidate and refuses every step
# the spec does not allow.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      candidate:
        description: The run id of the candidate's build on main
        required: true
      plan-sha256:
        description: The SHA-256 of the signing plan you reviewed
        required: true
      qualification:
        description: The voice qualification evidence file, as a URL the runner can read
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          job: release-candidate
          verification: "false"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - run: printf '%s\n' "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install speech model converter dependencies
        run: |
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'
          python3 -m pip install 'numpy==2.2.6' 'zstandard==0.23.0' 'librosa==0.11.0' 'onnx==1.21.0' 'PyYAML==6.0.2' 'tqdm==4.67.1' 'requests==2.34.2'
      - name: Prepare the pinned Eliza packages
        run: |
          pnpm eliza
      - name: Assign the launcher version code
        id: version
        shell: bash
        run: |
          version_base=1000
          version_code=$((version_base + GITHUB_RUN_NUMBER))
          if (( version_code > 2100000000 )); then
            echo 'The launcher version code exceeds the Android limit.' >&2
            exit 1
          fi
          printf 'code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @repo/app android build --release
        env:
          TELEGRAM_API_ID: ${{ vars.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ELIZAOS_VERSION_CODE: ${{ steps.version.outputs.code }}
      - name: Build the candidate, mirror it and plan its signing
        working-directory: apps/app
        env:
          GH_TOKEN: ${{ github.token }}
          ELIZAOS_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          private="$RUNNER_TEMP/candidate"
          mkdir -p "$private"
          pnpm -s release upstream --out "$private/upstream.json"
          pnpm -s release candidate --run "$private/run.json" --number "$ELIZAOS_VERSION_CODE" --attempt "$GITHUB_RUN_ATTEMPT" --apk-manifest artifacts/apk-manifest.json --upstream "$private/upstream.json"
          pnpm -s release mirror --run "$private/run.json" --apk artifacts/launcher-release-unsigned.apk --to "$private"
          pnpm -s release plan --run "$private/run.json" --apk artifacts/launcher-release-unsigned.apk --out "$private/plan.json" | tee "$private/plan-answer.json"
          echo "Signing plan: \`$(node -p 'require(process.argv[1]).planSha256' "$private/plan-answer.json")\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          job: release-publish
          verification: "false"
      - uses: actions/download-artifact@v5
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: Review, sign, deliver, qualify and publish
        working-directory: apps/app
        env:
          ALPHA_APP_RELEASE_KEYSTORE_B64: ${{ secrets.ALPHA_APP_RELEASE_KEYSTORE_B64 }}
          ALPHA_APP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_APP_RELEASE_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ inputs.plan-sha256 }}
          QUALIFICATION: ${{ inputs.qualification }}
        run: |
          private="$RUNNER_TEMP/candidate"
          run="$private/run.json"
          unsigned=("$private"/alpha-phone-*-unsigned.apk)
          [[ ${#unsigned[@]} == 1 && -f ${unsigned[0]} ]] || { echo 'Expected one unsigned launcher APK'; exit 1; }
          keys="$RUNNER_TEMP/keys"
          install -d -m 700 "$keys"
          printf '%s' "$ALPHA_APP_RELEASE_KEYSTORE_B64" | base64 -d > "$keys/release.p12"
          chmod 600 "$keys/release.p12"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          pnpm -s release review --run "$run" --plan "$private/plan.json" --plan-sha256 "$PLAN_SHA256"
          pnpm -s release sign --run "$run" --plan "$private/plan.json" --apk "${unsigned[0]}" --out artifacts/launcher-release.apk --keystore "$keys/release.p12" --key-label alpha-release --apksigner "$apksigner"
          rm -rf "$keys"
          pnpm android verify
          pnpm -s release deliver --run "$run" --apk artifacts/launcher-release.apk --apk-manifest artifacts/apk-manifest.json --to "$RUNNER_TEMP/delivered"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/qualification.json" "$QUALIFICATION"
          pnpm -s release qualify --run "$run" --apk artifacts/launcher-release.apk --evidence "$RUNNER_TEMP/qualification.json"
          number=$(node -p 'require(process.argv[1]).state.number' "$run")
          pnpm -s release manifest --apk artifacts/launcher-release.apk --version "$number" --out "$RUNNER_TEMP/alpha-update-stable.json"
          pnpm -s release publish --run "$run" --apk artifacts/launcher-release.apk --manifest "$RUNNER_TEMP/alpha-update-stable.json" --execute
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-ledger
          path: |
            ${{ runner.temp }}/candidate/run.json
            ${{ runner.temp }}/candidate/upstream.json
          retention-days: 90
