name: Launcher OTA native input expiry

on:
  schedule:
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.repository_id == '1396333361' && github.repository_owner_id == '314117943' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Report expiry for the reviewed artifact pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/check-native-input-expiry.py
