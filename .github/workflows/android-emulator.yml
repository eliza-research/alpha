name: Android emulator evidence
# Dispatch only. Every job after `build` boots an emulator on a hosted runner, so nothing
# here runs on a push, a pull request or a schedule. The result is
# emulator-class evidence on developer-override APKs (unpackaged resident runtime) on an
# x86_64 SDK image: never a distributable build, a device or acceptance.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Emulator evidence to produce (browser-controls runs only when selected)
        type: choice
        required: true
        default: instrumentation
        options:
          - instrumentation
          - browser-reading
          - browser-controls
          - all
permissions:
  contents: read
concurrency:
  # A later dispatch of the same suite on the same ref supersedes the earlier one.
  group: android-emulator-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true
jobs:
  build:
    name: Build developer APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact_id: ${{ steps.apks.outputs.artifact-id }}
      source_sha: ${{ github.sha }}
      manifest_sha256: ${{ steps.freeze.outputs.manifest }}
      test_mocks_manifest_sha256: ${{ steps.freeze.outputs.test_mocks_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The pinned upstream SDK retains Node-based build tooling.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The fused engine wrappers (prepare-embedding-host) require the pinned CMake release.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: bun install --frozen-lockfile
      - name: Prepare pinned native lifecycle sources
        run: bun scripts/prepare-local-agent.ts --source-only
      - name: Build flag-off developer APKs with their instrumentation APKs
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ""
        run: bun run android:build -- --allow-unpackaged-runtime
      # The browser suites use loopback fixtures that require the separate test-mocks build.
      - name: Build the separate test-mocks APKs
        if: inputs.suite == 'browser-reading' || inputs.suite == 'browser-controls' || inputs.suite == 'all'
        run: |
          before=$(sha256sum artifacts/*.apk artifacts/instrumentation/*.apk)
          bun run android:build -- --test-mocks --allow-unpackaged-runtime
          test "$before" = "$(sha256sum artifacts/*.apk artifacts/instrumentation/*.apk)"
      - name: Anchor the exact manifests
        id: freeze
        run: |
          {
            echo "manifest=$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)"
            if [ -f artifacts/test-mocks/apk-manifest.json ]; then
              echo "test_mocks_manifest=$(sha256sum artifacts/test-mocks/apk-manifest.json | cut -d' ' -f1)"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: apks
        with:
          name: android-emulator-apks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The upload roots this archive at artifacts/. Restore it there in each emulator job.
          path: |
            artifacts/apk-manifest.json
            artifacts/standalone-debug.apk
            artifacts/launcher-debug.apk
            artifacts/instrumentation/*.apk
            artifacts/test-mocks/apk-manifest.json
            artifacts/test-mocks/*-debug.apk
            artifacts/test-mocks/*-androidTest.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.json
            artifacts/test-mocks/*.json
            android/app/build/reports/
          retention-days: 3

  # (c) The default instrumentation run on both distributions.
  instrumentation:
    name: Default instrumentation, both distributions
    needs: build
    if: inputs.suite == 'instrumentation' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      # The runner imports only checked-in scripts and Node builtins; no dependency install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Require the build job's exact APK manifest, capacity and KVM
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "Insufficient fresh-runner emulator capacity"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bun scripts/ci/emulator-suite.ts instrumentation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-instrumentation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/android-instrumentation/
            test-results/emulator-suite/
            test-results/android-fixture/
            artifacts/apk-manifest.json
          if-no-files-found: error
          retention-days: 3

  # (b) The selected browser suite, on the pinned Chromium 157 WebView.
  browser-reading:
    name: ${{ inputs.suite == 'browser-controls' && 'Browser controls on WebView 157' || 'Browser reading on WebView 157' }}
    needs: build
    if: inputs.suite == 'browser-reading' || inputs.suite == 'browser-controls' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BROWSER_SUITE: ${{ inputs.suite == 'browser-controls' && 'browser-controls' || 'browser-reading' }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      EXPECTED_TEST_MOCKS_MANIFEST_SHA256: ${{ needs.build.outputs.test_mocks_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Require the build job's exact APK manifests, capacity and KVM
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          test -n "$EXPECTED_TEST_MOCKS_MANIFEST_SHA256"
          test "$(sha256sum artifacts/test-mocks/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_TEST_MOCKS_MANIFEST_SHA256"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "Insufficient fresh-runner emulator capacity"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          # Chromium recommends at least 4 GB of guest storage for WebView development.
          disk-size: 4096M
          # The provider is replaced on this fresh disposable AOSP image only: a writable system
          # partition, host Vulkan off across the framework restart, and the boot devices the
          # provisioner reads back.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -writable-system -append-userspace-opt 'androidboot.boot_devices=pci0000:00/0000:00:03.0 pci0000:00/0000:00:05.0 pci0000:00/0000:00:06.0'
          disable-animations: true
          script: bun scripts/ci/emulator-suite.ts ${{ env.BROWSER_SUITE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-${{ env.BROWSER_SUITE }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The pinned URL and hashes reproduce the provider archive; it is not uploaded again.
          path: |
            test-results/android-instrumentation/
            test-results/emulator-suite/
            test-results/android-fixture/
            test-results/ci-webview-provider/
            !test-results/ci-webview-provider/chromium.zip
            !test-results/ci-webview-provider/SystemWebView.apk
            artifacts/apk-manifest.json
            artifacts/test-mocks/apk-manifest.json
          if-no-files-found: error
          retention-days: 3
