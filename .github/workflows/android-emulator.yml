name: Android emulator evidence
# The one emulator lane: nightly on the default branch and on dispatch, never on a push or a pull
# request. One job builds the launcher APKs and runs both suites on hosted x86_64 SDK emulators.
# The result is emulator-class evidence for the launcher debug APK: never a distributable
# build, a device or acceptance.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  # The native input artifacts are read through the workflow token.
  actions: read
concurrency:
  # A later run on the same ref supersedes the earlier one.
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    name: Launcher APKs on the emulator
    runs-on: ubuntu-24.04
    # Preserve the former build180 + instrumentation90 + browser90 job budgets.
    timeout-minutes: 360
    steps:
      # The build and both emulators share this runner's disk.
      - name: Free disk on the disposable runner
        run: |
          for unused in /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/powershell; do
            if [ -d "$unused" ]; then sudo rm -rf -- "$unused"; fi
          done
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The fused engine wrappers (prepare-embedding-host) require the pinned CMake release.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: bun install --frozen-lockfile
      - name: Select the native input cache
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/alpha-emulator-cache" >> "$GITHUB_ENV"
      - name: Resolve the current native build recipe
        id: native-recipe
        run: |
          echo "sha256=$(bun -e 'import {nativeRecipe,nativeRecipeDigest} from "./scripts/native-build-inputs.ts"; process.stdout.write(nativeRecipeDigest(nativeRecipe(process.cwd())))')" >> "$GITHUB_OUTPUT"
      - name: Restore the exact native source recipe
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/alpha/native-inputs
          key: alpha-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-recipe.outputs.sha256 }}
      - name: Acquire hash-pinned Android Bun with step-only authentication
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_LOCAL_AGENT_SOURCE_DIR: ${{ github.workspace }}/vendor/eliza
        run: python3 scripts/ci/acquire-resident-bun.py
      - name: Build the launcher APKs with their instrumentation APK
        id: build
        timeout-minutes: 180
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: bun run android:build:local -- --release
      - name: Anchor the exact build manifest
        id: freeze
        run: echo "manifest=$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-apks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/apk-manifest.json
            artifacts/launcher-debug.apk
            artifacts/instrumentation/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Require emulator capacity and KVM
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "Insufficient fresh-runner emulator capacity"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The default instrumentation run.
      - name: Default instrumentation
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "${{ steps.freeze.outputs.manifest }}"
            bun scripts/ci/emulator-suite.ts instrumentation
      # The browser reading suite, on the pinned Chromium 157 WebView. It runs even when the
      # instrumentation suite failed, and last, because it replaces the image's WebView provider.
      - name: Browser reading on WebView 157
        timeout-minutes: 90
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          # Chromium recommends at least 4 GB of guest storage for WebView development.
          disk-size: 4096M
          # The provider is replaced on this fresh disposable AOSP image only: wiped user data
          # (the instrumentation run installed the launcher), a writable system partition, host
          # Vulkan off across the framework restart, and the boot devices the provisioner reads back.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -wipe-data -noaudio -no-boot-anim -writable-system -append-userspace-opt 'androidboot.boot_devices=pci0000:00/0000:00:03.0 pci0000:00/0000:00:05.0 pci0000:00/0000:00:06.0'
          disable-animations: true
          script: |
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "${{ steps.freeze.outputs.manifest }}"
            bun scripts/ci/emulator-suite.ts browser-reading
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The pinned URL and hashes reproduce the provider archive; it is not uploaded again.
          path: |
            artifacts/apk-manifest.json
            test-results/android-instrumentation/
            test-results/emulator-suite/
            test-results/android-fixture/
            test-results/ci-webview-provider/
            !test-results/ci-webview-provider/chromium.zip
            !test-results/ci-webview-provider/SystemWebView.apk
            android/app/build/reports/
          if-no-files-found: error
          retention-days: 3
