name: Native crash bridge induction qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prove bridge initialization, inductive preservation and implication
        run: |
          set -euo pipefail
          mkdir -p test-results/induction
          python3 - <<'PYPROOF'
          import subprocess,hashlib,json,pathlib,os,signal,time
          out=pathlib.Path('test-results/induction');model=pathlib.Path('specs/quint/native/NativeCrashJournal.qnt')
          cmd=['bun','node_modules/@informalsystems/quint/dist/src/cli.js','verify',str(model),'--main=NativeCrashJournal','--init=init','--step=step','--invariant=BridgeRowsAllowlisted','--inductive-invariant=BridgeRowsAllowlisted','--max-steps=6','--verbosity=5','--apalache-version=0.62.4','--apalache-config=scripts/ci/native-crash-completion-factor.json','--server-endpoint=127.0.0.1:8845']
          receipt={'command':cmd,'head':os.environ['GITHUB_SHA'],'modelSha256':hashlib.sha256(model.read_bytes()).hexdigest(),'startedAt':time.time(),'scope':'Exploratory independent induction; not a replacement six-step safety verdict.'}
          env=os.environ.copy();env['JVM_ARGS']='-Xmx4g';env['JVM_GC_ARGS']=''
          for k in ['JAVA_TOOL_OPTIONS','_JAVA_OPTIONS','SMT_SOLVER','SMT_ENCODING','CONFIG_FILE']:env.pop(k,None)
          with (out/'output.log').open('wb') as log:
            child=subprocess.Popen(cmd,stdout=log,stderr=subprocess.STDOUT,env=env,start_new_session=True)
            try:status=child.wait(timeout=600)
            except subprocess.TimeoutExpired:
              os.killpg(child.pid,signal.SIGKILL);status=child.wait();receipt['timedOut']=True
          receipt.update(exitCode=status,endedAt=time.time(),modelSha256After=hashlib.sha256(model.read_bytes()).hexdigest());(out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print((out/'output.log').read_text());raise SystemExit(status)
          PYPROOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-bridge-induction
          path: test-results/induction
