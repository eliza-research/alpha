name: Temporal candidate qualification
run-name: Full temporal candidate qualification
# Scratch-branch qualification only. The default branch's full Promotion is unchanged.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporal-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  temporal:
    name: Full temporal candidate (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: [PhotosLibrary, NotesView]
    env:
      ALPHA_TEMPORAL_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run upstream:prepare-client
      - name: Admit the reviewed candidate bytes
        run: |
          sha256sum --check <<'PINS'
          8b6db50b1d1c69a8e0ce0e89c9ea595b635141516ae2f240e9a669400c7643d2  specs/quint/legacy/PhotosLibrary.qnt
          777065d4bd070352db17ae76625a094da0db6f18f2695cf703ef4a9e6d75ba59  specs/quint/legacy/NotesView.qnt
          PINS
      - name: Original scenarios and sampled checks at registered defaults
        run: bun scripts/check-quint.ts check --models="$ALPHA_TEMPORAL_MODEL" --out="test-results/quint/canonical-$ALPHA_TEMPORAL_MODEL.json"
      - name: Full fairness-guarded temporal qualification
        run: |
          alpha_temporal_watch_dir=$(mktemp -d "$RUNNER_TEMP/alpha-temporal-watch.XXXXXX")
          python3 - "$ALPHA_TEMPORAL_MODEL" "$alpha_temporal_watch_dir" <<'PYWATCH' &
          from pathlib import Path
          import hashlib,json,sys,tempfile,time
          model,control=sys.argv[1],Path(sys.argv[2])
          assert model in ['PhotosLibrary','NotesView']
          started=time.time()
          destination=Path('test-results/quint')/f'translation-{model}'
          while not (control/'stop').exists():
            for source in Path(tempfile.gettempdir()).glob(f'quint-tlc-*/{model}.tla'):
              config=source.with_suffix('.cfg')
              if source.stat().st_mtime<started or not config.exists(): continue
              tla,cfg=source.read_bytes(),config.read_bytes()
              if cfg!=b'INIT q_init\nNEXT q_step\nPROPERTY q_temporalProps\n': continue
              if not tla.rstrip().endswith(b'===================='): continue
              destination.mkdir(parents=True,exist_ok=True)
              (destination/f'{model}.tla').write_bytes(tla)
              (destination/f'{model}.cfg').write_bytes(cfg)
              (destination/'capture.json').write_text(json.dumps({'actualSource':str(source),
                'translatedSha256':hashlib.sha256(tla).hexdigest(),
                'configurationSha256':hashlib.sha256(cfg).hexdigest(),
                'capturedAfterOwnedLaunch':True},indent=2)+'\n')
              raise SystemExit(0)
            time.sleep(0.25)
          PYWATCH
          alpha_temporal_watcher_pid=$!
          alpha_temporal_finish() {
            alpha_temporal_cli_status=$?
            touch "$alpha_temporal_watch_dir/stop"
            wait "$alpha_temporal_watcher_pid" || true
            return "$alpha_temporal_cli_status"
          }
          trap alpha_temporal_finish EXIT
          bun scripts/check-quint.ts temporal --models="$ALPHA_TEMPORAL_MODEL" --out="test-results/quint/temporal-$ALPHA_TEMPORAL_MODEL.json"
      - name: Record proof and tool custody
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,subprocess
          model=os.environ['ALPHA_TEMPORAL_MODEL']
          assert model in ['PhotosLibrary','NotesView']
          out=Path('test-results/quint');out.mkdir(parents=True,exist_ok=True)
          proof=out/f'temporal-{model}.json'
          receipt=json.loads(proof.read_text()) if proof.exists() else {}
          jar=Path(os.environ.get('QUINT_HOME',str(Path.home()/'.quint')))/'apalache-dist-0.62.4/apalache/lib/apalache.jar'
          jar_hash=hashlib.sha256(jar.read_bytes()).hexdigest() if jar.exists() else None
          phases=receipt.get('results',[])
          result=phases[0] if len(phases)==1 else {}
          output=result.get('output','')
          stats=re.findall(r'([0-9,]+) states generated, ([0-9,]+) distinct states found, ([0-9,]+) states left on queue\.',output)
          final_stats=[int(value.replace(',','')) for value in stats[-1]] if stats else None
          branches=re.findall(r'Implied-temporal checking--satisfiability problem has ([0-9]+) branches',output)
          config=json.loads(Path('specs/quint/tlc.json').read_text())
          translation=out/f'translation-{model}'
          captured=json.loads((translation/'capture.json').read_text()) if (translation/'capture.json').exists() else None
          tla=(translation/f'{model}.tla').read_bytes() if (translation/f'{model}.tla').exists() else b''
          cfg=(translation/f'{model}.cfg').read_bytes() if (translation/f'{model}.cfg').exists() else b''
          custody={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'model':model,'modelSha256':hashlib.sha256(Path(f'specs/quint/legacy/{model}.qnt').read_bytes()).hexdigest(),
            'checkerSha256':hashlib.sha256(Path('scripts/check-quint.ts').read_bytes()).hexdigest(),
            'jarSha256':jar_hash,'jarPinMatches':jar_hash=='e5223915507b65cc5f1638bd037ede60f8a4fc1644aff46355779f9b05df9262',
            'tlcConfig':config,'temporalBranches':branches,'finalGeneratedDistinctQueue':final_stats,
            'actualTranslationCapture':captured,
            'proofPassed':receipt.get('passed',False),'finalInputErrors':receipt.get('finalInputErrors'),
            'scope':'Full registered temporal relation and fairness; no bounded fallback, state filter, domain reduction or property omission.'}
          (out/f'custody-{model}.json').write_text(json.dumps(custody,indent=2)+'\n')
          if receipt.get('passed'):
            assert result.get('model')==model and result.get('phase')=='tlc-temporal' and result.get('backend')=='tlc'
            assert '--temporal=CheckedTemporal' in result['argv'] and '--backend=tlc' in result['argv']
            assert config=={'workers':'2','maxHeap':'-Xmx2G','stackSize':'-Xss16m'}
            assert receipt['timeoutSeconds']==1800 and not receipt['finalInputErrors']
            assert custody['jarPinMatches'] and final_stats and final_stats[2]==0
            assert captured and cfg==b'INIT q_init\nNEXT q_step\nPROPERTY q_temporalProps\n'
            assert hashlib.sha256(tla).hexdigest()==captured['translatedSha256']
            assert hashlib.sha256(cfg).hexdigest()==captured['configurationSha256']
            assert b'q_bounded_depth' not in tla and b'CONSTRAINT' not in cfg
            assert branches and int(branches[-1])=={'PhotosLibrary':4,'NotesView':6}[model]
            assert 'Model checking completed. No error has been found.' in output
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: temporal-candidate-${{ matrix.model }}
          path: test-results/quint/
