name: Promotion checks

# Full uncached verification gate for promoting to main:
# runs Node 26 + pnpm verify without cached verification receipts, verifies third-party
# notices, checks zero Bun usage, and confirms the pinned Eliza commit is reachable upstream.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  simulate:
    name: Fresh simulations ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: simulate-promotion-${{ matrix.shard }}
          cache-verification: "false"
      - id: simulations
        name: Run this shard's simulations
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: node vibestack/spec.ts ci precompute-simulations
      - uses: actions/upload-artifact@v7
        with:
          name: promotion-simulations-${{ matrix.shard }}
          path: ${{ steps.simulations.outputs.directory }}/simulate-*.json.*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  verify-fresh:
    name: Fresh verification, specs, browser tests and notices
    needs: simulate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: promotion
          verification: "true"
          cache-verification: "false"
      - name: Verify zero Bun
        run: pnpm no-bun
      - name: Prepare pinned Eliza checkout and verify upstream reachability
        run: |
          pnpm eliza
          pnpm --filter @repo/app android pin
      - name: Verify third-party notices and release signer record
        run: |
          pnpm --filter @repo/app licences --check
          python3 scripts/ci/app_update_producer.py signer-record apps/app/aosp/signing/release-signer.json
      - name: Collect simulations from this promotion
        uses: actions/download-artifact@v8
        with:
          pattern: promotion-simulations-*
          path: .spec-cache
          merge-multiple: true
      - name: Run full uncached verification suite
        run: pnpm verify --concurrency=4 --continue=dependencies-successful --log-order=stream
      - name: Run image, release, and AOSP conformance tests
        run: |
          pnpm --filter @repo/app exec vitest run test/image.test.ts
          python3 apps/app/aosp/branding/provision/test_fresh_presets.py
