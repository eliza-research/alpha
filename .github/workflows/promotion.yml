name: Uploaded artifact metadata read qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Produce a controlled read-only metadata fixture
        run: |
          mkdir -p test-results/metadata-control
          printf '%s\n' 'Controlled artifact transport qualification; no APK or release evidence.' > test-results/metadata-control/payload.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: payload
        with:
          name: metadata-control-payload-${{ github.run_id }}
          path: test-results/metadata-control/payload.txt
          if-no-files-found: error
          retention-days: 3
      - name: Compare immediate metadata reads with the same step-scoped token
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_CONTROL_ID: ${{ steps.payload.outputs.artifact-id }}
          METADATA_CONTROL_SHA256: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          bun - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {uploadedCandidateMetadata} from './scripts/app-update-candidate.ts';
          const id=process.env.METADATA_CONTROL_ID,expected=process.env.METADATA_CONTROL_SHA256;
          let original;
          try {
            const bytes=execFileSync('gh',['api','repos/eliza-research/alpha/actions/artifacts/'+id],{encoding:'utf8',timeout:10000,maxBuffer:16*1024**2,stdio:['ignore','pipe','pipe']});
            const value=JSON.parse(bytes);original={succeeded:true,bytes:Buffer.byteLength(bytes),id:value.id};
          } catch(error) {
            original={succeeded:false,httpStatus:String(error.stderr??'').match(/HTTP ([0-9]{3})/)?.[1]??null,exitCode:error.status??null,code:error.code??null,stdoutBytes:error.stdout?Buffer.byteLength(error.stdout):0};
          }
          const report={head:process.env.GITHUB_SHA,artifactId:Number(id),originalGhRead:original,scope:'Fresh controlled artifact metadata only; no distribution or signing claim.'};
          try {
            const metadata=await uploadedCandidateMetadata(id,process.env.GH_TOKEN);
            assert.equal(metadata.id,Number(id));assert.equal(metadata.digest,'sha256:'+expected);
            assert.equal(metadata.workflow_run.id,Number(process.env.GITHUB_RUN_ID));
            assert.equal(metadata.workflow_run.head_sha,process.env.GITHUB_SHA);
            assert.equal(metadata.workflow_run.head_branch,'codex/artifact-metadata-read-qualification-20261113');
            assert.equal(metadata.expired,false);assert.ok(Number.isSafeInteger(metadata.size_in_bytes)&&metadata.size_in_bytes>0);
            report.directRead={passed:true,id:metadata.id,digest:metadata.digest,bytes:metadata.size_in_bytes};
          } catch(error) {report.directRead={passed:false,error:error.message};throw error;}
          finally {fs.writeFileSync('test-results/metadata-control/report.json',JSON.stringify(report,null,2)+'\n');}
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: metadata-control-evidence-${{ github.run_id }}
          path: test-results/metadata-control/report.json
          if-no-files-found: error
          retention-days: 3
