name: Verified native portable input packet
run-name: Export admitted60760 native bytes with unchanged Linux producer receipt
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Select the same pinned inspection tools and cache path
        run: |
          sdkmanager 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/alpha-cache" >> "$GITHUB_ENV"
      - name: Provision build capacity on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$ANDROID_NDK_HOME" = /usr/local/lib/android/sdk/ndk/28.2.13676358
          test "$ANDROID_NDK" = "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_ROOT" = "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_LATEST_HOME" = "$ANDROID_NDK_HOME"
          test "$(realpath "$ANDROID_NDK_HOME")" = "$ANDROID_NDK_HOME"
          grep -Eq '^Pkg.Revision *= *28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          # AGP 8.13 defaults to 35.0.0; APK inspection explicitly uses 36.0.0.
          # Authenticate retained tools before any fresh-image cleanup.
          for revision in 35.0.0 36.0.0; do
            selected="/usr/local/lib/android/sdk/build-tools/$revision"
            test -d "$selected"
            test ! -L "$selected"
            test "$(realpath "$selected")" = "$selected"
            actual=$(sed -n 's/^Pkg.Revision *= *//p' "$selected/source.properties" | tr -d '\r')
            test "$actual" = "$revision"
          done
          # Validate the complete fixed removal set before deleting any of it.
          # Other versions and all platforms, sources and artifacts are preserved.
          for revision in 34.0.0 35.0.1 36.1.0 37.0.0; do
            unused="/usr/local/lib/android/sdk/build-tools/$revision"
            test ! -L "$unused"
            if [ -e "$unused" ]; then
              test -d "$unused"
              test "$(realpath "$unused")" = "$unused"
              actual=$(sed -n 's/^Pkg.Revision *= *//p' "$unused/source.properties" | tr -d '\r')
              test "$actual" = "$revision"
            fi
          done
          python3 -c 'import shutil; print("freshCapacityBeforeBytes="+str(shutil.disk_usage(".").free))'
          df -h "$GITHUB_WORKSPACE"
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then
              test "$(realpath "$unused")" = "$unused"
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          df -h "$GITHUB_WORKSPACE"
          # Exact preinstalled image versions only; neither is the selected 28.2 NDK.
          for revision in 27.3.13750724 29.0.14206865; do
            unused="/usr/local/lib/android/sdk/ndk/$revision"
            if [ -e "$unused" ]; then
              test "$unused" != "$ANDROID_NDK_HOME"
              test "$(realpath "$unused")" = "$unused"
              actual=$(sed -n 's/^Pkg.Revision *= *//p' "$unused/source.properties" | tr -d '\r')
              test "$actual" = "$revision"
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          # Exact unused build-tools revisions from ubuntu24/20260927.320 only.
          for revision in 34.0.0 35.0.1 36.1.0 37.0.0; do
            unused="/usr/local/lib/android/sdk/build-tools/$revision"
            if [ -e "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          grep -Eq '^Pkg.Revision *= *28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("freshCapacityAfterBytes="+str(free)); assert free >= 32*1024**3, "Fresh runner needs at least 32GiB for resident archive headroom"'
          df -h "$GITHUB_WORKSPACE"
      # Archive host fixtures need genuine Node; native/SDK producers still use Bun.
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: native-cache
        with:
          path: ${{ env.XDG_CACHE_HOME }}/alpha/native-inputs
          key: alpha-native-Linux-X64-60760c2e524f5b7f59bc637f3502fdb2fe2fb68b52a2d891296ac7874d3d806f
      - name: Require the exact admitted cache; never rebuild or accept a fallback
        run: test '${{ steps.native-cache.outputs.cache-hit }}' = 'true'
      - name: Verify and export only native inventory bytes
        run: bun scripts/ci/export-native-portable-inputs.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native60760-portable-verified-inputs
          path: test-results/native-portable-inputs/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
