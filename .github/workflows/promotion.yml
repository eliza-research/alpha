name: Exhaustive crash initial seed cover qualification
run-name: Full CI6 crash initial seed cover at original aggregate budget
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crash-seed-cover-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit exact original seed cover and controller
        run: |
          git fetch --no-tags --depth=1 origin 33397b9f538bafb7af22b79f5359e761bf5a5100
          sha256sum --check <<'PINS'
          6940f8de6a67918d1bd4c367806a79fc67467f792b586c30cc6d9205b9bed05f  specs/quint/native/NativeCrashJournal.qnt
          d101b1c618c5fd22b54dc102e74a27327519f527800959ca5cf3e6c3ac376c4b  scripts/ci/qualify-native-crash-seed-cover.py
          PINS
      - name: All seven original initial seeds under one aggregate1800 second budget
        run: python3 scripts/ci/qualify-native-crash-seed-cover.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-crash-original-initial-seed-cover
          path: test-results/quint/initial-seed-cover/
          if-no-files-found: error
