name: Release custody proof

on:
  workflow_dispatch:
    inputs:
      workflow_commit:
        description: Exact reviewed workflow commit on Alpha main
        required: true
        type: string
      proof_sha256:
        description: SHA-256 of the reviewed custody proof script
        required: true
        type: string

permissions: {}

concurrency:
  group: release-custody-proof
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1396333361' && github.repository_owner_id == '314117943' && github.ref == 'refs/heads/main' && inputs.workflow_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Admit the reviewed custody checker before loading secrets
        env:
          PROOF_SHA256: ${{ inputs.proof_sha256 }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_COMMIT" = "$GITHUB_SHA"
          test "$WORKFLOW_COMMIT" = "$(git rev-parse HEAD)"
          [[ "$PROOF_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  scripts/ci/release-custody-proof.py\n' "$PROOF_SHA256" | sha256sum --check --strict
      - name: Check the custody verifier with disposable keys
        run: python3 scripts/ci/release-custody-proof.test.py
      - name: Verify the protected release keys
        shell: bash
        env:
          ALPHA_OS_RELEASE_KEYS_PART1_B64: ${{ secrets.ALPHA_OS_RELEASE_KEYS_PART1_B64 }}
          ALPHA_OS_RELEASE_KEYS_PART2_B64: ${{ secrets.ALPHA_OS_RELEASE_KEYS_PART2_B64 }}
          ALPHA_OS_RELEASE_KEYS_PASSPHRASE: ${{ secrets.ALPHA_OS_RELEASE_KEYS_PASSPHRASE }}
          ALPHA_APP_RELEASE_KEYSTORE_B64: ${{ secrets.ALPHA_APP_RELEASE_KEYSTORE_B64 }}
          ALPHA_APP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_APP_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          ulimit -c 0
          test "$GITHUB_REF" = refs/heads/main
          test "$(stat -f -c %T /dev/shm)" = tmpfs
          python3 scripts/ci/release-custody-proof.py
      - name: Export only public custody evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-custody-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/release-custody-proof.json
            artifacts/release-public-identities/
          if-no-files-found: error
          retention-days: 14
