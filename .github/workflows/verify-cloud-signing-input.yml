name: Verify Cloud APK signing input

on:
  workflow_call:
    inputs:
      signing_plan:
        description: Reviewed JSON plan for the exact unsigned producer archive
        required: true
        type: string
    outputs:
      plan_sha256:
        description: SHA-256 of the verified plan as supplied
        value: ${{ jobs.admit.outputs.plan_sha256 }}

permissions: {}

jobs:
  admit:
    if: github.repository_id == '1396333361' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      plan_sha256: ${{ steps.verify.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit only the reviewed Cloud producer archive
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PLAN: ${{ inputs.signing_plan }}
        run: bash scripts/ci/verify-cloud-signing-input.sh
