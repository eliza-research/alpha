name: Cloud deploy
run-name: Alpha Cloud ${{ inputs.action }} (${{ inputs.environment }}) on ${{ github.sha }}
# Deploys Alpha Cloud (docs/alpha-cloud.md) from the pinned upstream source: the Cloud API Worker,
# the Steward login Worker and container, and the cloud/edge web host. Manual and main-only.
#
# Each GitHub environment (alpha-cloud-staging, alpha-cloud-production) holds:
#   secret CLOUDFLARE_API_TOKEN   Workers Scripts/Routes/KV/R2/Hyperdrive/Containers edit + Zone DNS edit
#   secret ALPHA_CLOUD_ENV        the COMPLETED env file from `bun run cloud:worker -- secrets` (run once
#                                 locally): operator keys plus the generated internal secrets
# Account and resource ids come from the committed cloud/resources.json.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        type: choice
        options: [staging, production]
      action:
        description: "check: render and bundle only. deploy: secrets, migrations, registration, Workers, tenant, smoke."
        required: true
        type: choice
        options: [check, deploy]
      component:
        description: Worker to deploy (deploy only)
        required: true
        default: all
        type: choice
        options: [all, api, login, edge]
permissions:
  contents: read
concurrency:
  group: alpha-cloud-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  cloud:
    if: github.repository_id == '1396333361' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: alpha-cloud-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Restore the prepared upstream tree for this pin
        id: tree
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/alphaphone-cloud
          key: alpha-cloud-tree-${{ hashFiles('upstream.lock.json') }}-bun-1.4.2
      - name: Export, install and build the pinned upstream (never vendor/eliza in place)
        run: bun scripts/cloud-worker.ts prepare
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Render and bundle every Worker (dry run)
        run: bun scripts/cloud-worker.ts check --environment "${{ inputs.environment }}"
      - name: Write the private env file
        if: inputs.action == 'deploy'
        env:
          ALPHA_CLOUD_ENV: ${{ secrets.ALPHA_CLOUD_ENV }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ALPHA_CLOUD_ENV" || { echo "::error::ALPHA_CLOUD_ENV is not set for this environment"; exit 1; }
          printf '%s\n' "$ALPHA_CLOUD_ENV" > "$RUNNER_TEMP/alpha-cloud.env"
          chmod 600 "$RUNNER_TEMP/alpha-cloud.env"
      - name: Check the env file is complete (refuses to generate any secret in CI)
        if: inputs.action == 'deploy'
        run: bun scripts/cloud-worker.ts secrets --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env" --frozen
      - name: Check selected Cloudflare resources before database writes
        if: inputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/cloud-worker.ts preflight --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Apply Cloud database migrations
        if: inputs.action == 'deploy'
        run: bun scripts/cloud-worker.ts migrate --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Register ai.alphacompute.alphaphone (apps + native client rows)
        if: inputs.action == 'deploy'
        run: bun scripts/cloud-worker.ts seed --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Deploy Workers (each with its secrets)
        if: inputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/cloud-worker.ts deploy --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env" --component "${{ inputs.component }}"
      - name: Create the Steward tenant (idempotent)
        if: inputs.action == 'deploy' && (inputs.component == 'all' || inputs.component == 'login')
        run: bun scripts/cloud-worker.ts tenant --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Public readiness probe
        if: inputs.action == 'deploy'
        run: bun scripts/cloud-worker.ts smoke --environment "${{ inputs.environment }}"
      - name: Remove the env file
        if: always()
        run: rm -f "$RUNNER_TEMP/alpha-cloud.env"
