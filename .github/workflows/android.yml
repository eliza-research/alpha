name: Android foundation
on:
  # The build's inputs: Android and renderer sources, the scripts and root configuration that
  # produce the APKs, the lockfile and the upstream pin.
  pull_request:
    paths:
      - 'android/**'
      - 'apps/app/**'
      - 'scripts/**'
      - 'licenses/**'
      - app.config.json
      - capacitor.config.ts
      - vite.config.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - upstream.lock.json
      - .gitmodules
      - vendor/eliza
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
  # The native input artifacts are read through the workflow token.
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # bun run verify's LemmaScript fixture tests run on genuine Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # Native engine wrappers (prepare-embedding-host) require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: bun install --frozen-lockfile
      - name: Install browser for manual host verification
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/install-playwright-browser.sh chromium
      # The host JVM tests in bun run verify and the Calendar bridge both need the pinned org.json jar.
      - name: Prepare normal host-test JSON
        timeout-minutes: 1
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Prepare reviewed Kotlin compiler for native routing checks
        run: bun test/fixtures/kotlin-tools.mjs --prepare
      # bun run verify's prepared-SDK tests need the prepared SDK, as in verify.yml.
      - name: Prepare pinned SDK for manual verification
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          ALPHA_BUN="$(command -v bun)"
          export ALPHA_BUN
          test "$("$ALPHA_BUN" --version)" = '1.4.2'
          bun scripts/prepare-local-agent.ts
          prepared_source=$(bun -e "import {sourceDirectory,verifySource} from './scripts/local-agent-source.ts'; import fs from 'node:fs'; const source=sourceDirectory(process.cwd()); verifySource(source,JSON.parse(fs.readFileSync('upstream.lock.json','utf8')).commit); process.stdout.write(source);")
          echo "ALPHA_BUN=$ALPHA_BUN" >> "$GITHUB_ENV"
          echo "ALPHA_CLOUD_COLLECTOR_SOURCE=$prepared_source" >> "$GITHUB_ENV"
      - name: Verify manual qualification
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPHA_REQUIRE_PREPARED_SDK: '1'
        run: bun run verify
      - run: bun test --timeout=600000 vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # The normal chain builds and verifies its native source/model inputs.
      - name: Record tracked source frame before the Android build
        timeout-minutes: 1
        env:
          ALPHA_CALENDAR_BRIDGE_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/ci/calendar-bridge.py --source-frame
      - name: Build the launcher APKs
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          # A clean release R8 pass exhausted the default 2 GiB heap on this runner.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: bun run android:build:local
      # Use actual normal JavaCompile outputs; this qualification assembles no extra APK.
      # It reads ALPHA_JSON_JAR from the host-test JSON step above.
      - name: Qualify actual Calendar bridge in normal Java compile context
        timeout-minutes: 4
        env:
          ALPHA_CALENDAR_BRIDGE_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/ci/calendar-bridge.py
      - name: Require flag-off APKs
        run: |
          bun scripts/audit-production-bundle.ts web-dist
          bun - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/apk-manifest.json', 'utf8'));
          if (manifest.testMocks !== false || manifest.demoEntryPoints !== false) throw new Error('APKs must be testMocks:false and demoEntryPoints:false');
          if (manifest.results.length !== 2 || manifest.results.some(row => row.testMocks !== false || row.bundleAudit !== 'passed' || row.runtime !== 'PACKAGED')) throw new Error('Both launcher APKs must pass the flag-off bundle audit and package the runtime');
          console.log(JSON.stringify({ testMocks: manifest.testMocks, demoEntryPoints: manifest.demoEntryPoints, version: manifest.version, signing: manifest.signing.release }, null, 2));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-distribution-apks-${{ github.run_id }}-${{ github.run_attempt }}
          # R8 mappings travel with the exact APKs they deobfuscate.
          path: |
            artifacts/*.apk
            artifacts/mapping/*.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-build-evidence
          path: |
            artifacts/*.json
            # Written offline by the build beside the APKs it verified (scripts/generate-sbom.ts).
            artifacts/sbom/*.json
            artifacts/aosp/
            !artifacts/aosp/**/*.apk
            test-results/
            android/app/build/reports/
            android/voice-host/qualified-voice-host.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/inputs.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/taskgraph.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/bridge.log
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/result.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/gradle.log
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/supervisor.json
          retention-days: 3
