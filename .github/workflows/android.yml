name: Android foundation

on:
  pull_request:
    paths:
      - 'apps/app/**'
      - 'apps/agent/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - 'eliza.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: android
          verification: "false"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          printf '%s\n' "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Install speech model converter dependencies
        run: |
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'
          python3 -m pip install 'numpy==2.2.6' 'zstandard==0.23.0' 'librosa==0.11.0' 'onnx==1.21.0' 'PyYAML==6.0.2' 'tqdm==4.67.1' 'requests==2.34.2'
      - name: Verify zero Bun
        run: pnpm no-bun
      - name: Prepare pinned Eliza checkout and verify Android inputs and notices
        run: |
          pnpm eliza
          pnpm --filter @repo/app licences --check
          pnpm --filter @repo/app android inputs
      - name: Build and verify the launcher APKs (debug, instrumentation, release)
        env:
          TELEGRAM_API_ID: ${{ vars.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_HASH || '' }}
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: pnpm --filter @repo/app android build --release
      - name: Prepare verified Robolectric Android 35 framework jar
        run: bash scripts/ci/prepare-robolectric-android.sh "${HOME}/.m2/repository"
      - name: Run Alpha native JVM unit tests
        timeout-minutes: 15
        working-directory: apps/app/android
        run: |
          eliza_pin=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/eliza.lock.json").commit')
          engine_pin=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/.eliza/packages/os/android/local-inference/engine.lock.json").engine.commit')
          ./gradlew --no-daemon \
            "-PelizaInferenceEngineDir=$PWD/.cache/voice-engine/$engine_pin" \
            "-PelizaParadeeNativeDir=$PWD/.cache/voice/$eliza_pin" \
            -PelizaSpeechBridgeCapacitor=true :app:testLauncherDebugUnitTest
      - name: Verify AOSP Fresh Presets host JVM checks
        run: python3 apps/app/aosp/branding/provision/test_fresh_presets.py
      - name: Require flag-off APKs with packaged runtime
        run: |
          pnpm --filter @repo/app android audit dist
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("apps/app/artifacts/apk-manifest.json", "utf8"));
          if (manifest.testMocks !== false) throw new Error("APKs must be testMocks:false");
          if (manifest.results.length !== 2 || manifest.results.some((row) => row.testMocks !== false || row.bundleAudit !== "passed" || row.runtime !== "PACKAGED")) {
            throw new Error("Both launcher APKs must pass the flag-off bundle audit and package the runtime");
          }
          process.stdout.write(`${JSON.stringify({ testMocks: manifest.testMocks, version: manifest.version, abis: manifest.results.map((r) => ({ mode: r.mode, abis: r.abis })) }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v5
        with:
          name: android-distribution-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/app/artifacts/*.apk
            apps/app/artifacts/mapping/*.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/app/artifacts/*.json
            apps/app/artifacts/sbom/*.json
            apps/app/android/app/build/reports/
          retention-days: 3
