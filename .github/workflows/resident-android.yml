name: Resident Android exact source
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build APKs or publish only a reviewed embedding qualification
        type: choice
        required: false
        default: build
        options:
          - build
          - publish-qualification
      qualification_carrier:
        description: Upload-only JSON with commit, qualification_sha256, semantic_sha256
        type: string
        required: false
      embedding_component_artifact_id:
        description: Exact reviewed compiled component artifact ID
        type: string
        required: false
      embedding_component_sha256:
        description: SHA-256 of the compiled component artifact archive
        type: string
        required: false
      build_version_code:
        description: Dispatched build versionCode (25..2100000000), recorded in the producer evidence
        type: string
        required: true
        default: '26'
  # Main pushes build an unsigned native update candidate. Develop qualification
  # and the nightly lane still require the explicit qualification variable.
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
concurrency:
  # Main-push runs are isolated by run ID because GitHub can queue commits out of order.
  # Manual qualification keeps its cancellation group per ref and operation.
  group: resident-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('app-candidate-run-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.ref || format('{0}-{1}', github.event_name, github.sha)) }}${{ inputs.operation == 'publish-qualification' && '-carrier' || '' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  publish-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-qualification'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/embedding-qualification-carrier.yml
    with:
      carrier_json: ${{ inputs.qualification_carrier }}
      component_artifact_id: ${{ inputs.embedding_component_artifact_id }}
      component_sha256: ${{ inputs.embedding_component_sha256 }}
  build:
    permissions:
      contents: read
      actions: read
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'build' || inputs.operation == '')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && vars.ELIZA_RESIDENT_QUALIFICATION == 'push') ||
      (github.event_name == 'schedule' && vars.ELIZA_RESIDENT_QUALIFICATION == 'nightly')
    # All consumers select the reviewed NDK before unused image SDKs are removed.
    env:
      # One runtime profile: every build packages local speech and embeddings; speech is routed at run time.
      ALPHA_APP_UPDATE_CANDIDATE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
      ELIZA_ANDROID_BUN_TARGET: linux-musl
      ELIZA_ANDROID_TARGET_ABIS: arm64-v8a,x86_64
      ELIZA_BUN_CHANNEL: stable
      ELIZAOS_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_version_code || '' }}
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_LATEST_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    outputs:
      artifact_id: ${{ steps.apks.outputs.artifact-id }}
      source_sha: ${{ github.sha }}
      manifest_sha256: ${{ steps.freeze.outputs.sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the automatic native input manifest and artifact availability
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/hosted-native-inputs.py --check-remote
      # Install the selected toolchain before capacity provisioning authenticates it.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android native toolchain
        run: |
          python3 scripts/ci/resident-phase.py --name android-toolchain --seconds 1200 sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The fused engine wrappers (prepare-embedding-host) require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      # Fresh hosted image provisioning only. Never prune source, dependency
      # caches, selected Android tools or generated artifacts during a running phase.
      - name: Provision build capacity on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$ANDROID_NDK_HOME" = /usr/local/lib/android/sdk/ndk/28.2.13676358
          test "$ANDROID_NDK" = "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_ROOT" = "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_LATEST_HOME" = "$ANDROID_NDK_HOME"
          test "$(realpath "$ANDROID_NDK_HOME")" = "$ANDROID_NDK_HOME"
          grep -Eq '^Pkg.Revision *= *28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          # AGP 8.13 defaults to 35.0.0; APK inspection explicitly uses 36.0.0.
          # Authenticate retained tools before any fresh-image cleanup.
          for revision in 35.0.0 36.0.0; do
            selected="/usr/local/lib/android/sdk/build-tools/$revision"
            test -d "$selected"
            test ! -L "$selected"
            test "$(realpath "$selected")" = "$selected"
            actual=$(sed -n 's/^Pkg.Revision *= *//p' "$selected/source.properties" | tr -d '\r')
            test "$actual" = "$revision"
          done
          # Validate the complete fixed removal set before deleting any of it.
          # Other versions and all platforms, sources and artifacts are preserved.
          for revision in 34.0.0 35.0.1 36.1.0 37.0.0; do
            unused="/usr/local/lib/android/sdk/build-tools/$revision"
            test ! -L "$unused"
            if [ -e "$unused" ]; then
              test -d "$unused"
              test "$(realpath "$unused")" = "$unused"
              actual=$(sed -n 's/^Pkg.Revision *= *//p' "$unused/source.properties" | tr -d '\r')
              test "$actual" = "$revision"
            fi
          done
          python3 -c 'import shutil; print("freshCapacityBeforeBytes="+str(shutil.disk_usage(".").free))'
          df -h "$GITHUB_WORKSPACE"
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then
              test "$(realpath "$unused")" = "$unused"
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          df -h "$GITHUB_WORKSPACE"
          # Exact preinstalled image versions only; neither is the selected 28.2 NDK.
          for revision in 27.3.13750724 29.0.14206865; do
            unused="/usr/local/lib/android/sdk/ndk/$revision"
            if [ -e "$unused" ]; then
              test "$unused" != "$ANDROID_NDK_HOME"
              test "$(realpath "$unused")" = "$unused"
              actual=$(sed -n 's/^Pkg.Revision *= *//p' "$unused/source.properties" | tr -d '\r')
              test "$actual" = "$revision"
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          # Exact unused build-tools revisions from ubuntu24/20260927.320 only.
          for revision in 34.0.0 35.0.1 36.1.0 37.0.0; do
            unused="/usr/local/lib/android/sdk/build-tools/$revision"
            if [ -e "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          grep -Eq '^Pkg.Revision *= *28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("freshCapacityAfterBytes="+str(free)); assert free >= 32*1024**3, "Fresh runner needs at least 32GiB for resident archive headroom"'
          df -h "$GITHUB_WORKSPACE"
      # The pinned upstream SDK retains Node-based build tooling.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Check embedding artifact contract
        run: |
          python3 test/embedding-artifact-inputs.test.py
          python3 -B test/hosted-native-inputs.test.py
      - name: Validate dispatched build version
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PYCODE'
          import os, re
          value = os.environ['ELIZAOS_VERSION_CODE']
          assert re.fullmatch(r'[1-9][0-9]{0,9}', value) and 25 <= int(value) <= 2100000000, 'Dispatched candidate requires versionCode > retained V24'
          PYCODE
      - name: Verify acquisition target and transport contracts
        run: python3 -B scripts/ci/test-acquire-resident-bun.py
      - name: Admit exact tools and fresh source paths
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.2"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          mkdir -p test-results/resident-ci
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          limits = {}
          for file in ('/sys/fs/cgroup/memory.max', '/sys/fs/cgroup/memory/memory.limit_in_bytes'):
              path = Path(file)
              if path.is_file():
                  limits[file] = path.read_text().strip()
          Path('test-results/resident-ci/host-resources.json').write_text(json.dumps({'hostMemoryBytes': os.sysconf('SC_PHYS_PAGES') * os.sysconf('SC_PAGE_SIZE'), 'cpuCount': os.cpu_count(), 'kernelMemoryLimits': limits, 'phaseEntryGiB': 10, 'phaseStopGiB': 4, 'PGIDRSSCap': None, 'phaseLogByteCap': None, 'nodeHeapMiB': 4096, 'turboConcurrency': 1}, indent=2) + '\n')
          PYCODE
          echo "ALPHA_LOCAL_AGENT_SOURCE_DIR=$GITHUB_WORKSPACE/artifacts/resident-ci-92fc" >> "$GITHUB_ENV"
          echo "ALPHA_WORKFLOW_WORKER_OUTPUT=$GITHUB_WORKSPACE/artifacts/worker-ci-92fc" >> "$GITHUB_ENV"
      - name: Acquire exact native inputs for the automatic candidate
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/resident-phase.py --name native-input-download --seconds 600 python3 -B scripts/ci/hosted-native-inputs.py --acquire
      - name: Stage the admitted voice and embedding inputs
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        run: |
          bun scripts/android-stage-voice-models.ts --from test-results/resident-ci-native-inputs/voice
          bun scripts/build-embedding-host.ts --from test-results/resident-ci-native-inputs/embedding
          bun scripts/voice-host.ts --verify
      - name: Qualify supervisor on real Linux processes
        timeout-minutes: 10
        run: |
          python3 scripts/ci/test-resident-phase.py
          python3 test/resident-crash-diagnostic.test.py
      - run: python3 scripts/ci/resident-phase.py --name product-install --seconds 600 bun install --frozen-lockfile
      - name: Admit the automatic candidate version against the public inventory
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/app-update-candidate.ts version test-results/resident-ci-candidate/version.json
          echo "ELIZAOS_VERSION_CODE=$(bun -p 'require("./test-results/resident-ci-candidate/version.json").versionCode')" >> "$GITHUB_ENV"
      - name: Prepare pinned JSON dependency for host contract tests
        shell: bash
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Verify source metadata and voice contracts before resident preparation
        timeout-minutes: 5
        run: |
          python3 scripts/ci/resident-phase.py --name source-metadata --seconds 240 \
            bash -e -c '
              bun run upstream:prepare-client
              exec bun test \
                test/embedding-host-admission.test.mjs \
                test/upstream-reachability.test.mjs \
                test/voice-host-record.test.mjs \
                test/cloud-voice-profile.test.mjs \
                test/private-preview-cartesia-route.test.mjs
            '
      - run: bun test --timeout=600000 vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # Noncandidate diagnostics retain their existing absent-input check.
      - name: Verify the diagnostic on-device voice host record
        if: env.ALPHA_APP_UPDATE_CANDIDATE != '1'
        run: bun scripts/voice-host.ts --verify --allow-absent
      - name: Prepare and qualify fresh resident source with normal hooks
        env:
          RUN_TURBO_CONCURRENCY: "1"
        run: |
          python3 scripts/ci/resident-phase.py --name prepare --seconds 3600 bun run agent:prepare
      - name: Capture the hydrated SDK lock and graph
        if: github.event_name == 'workflow_dispatch' || env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        run: |
          source="$ALPHA_LOCAL_AGENT_SOURCE_DIR"
          mkdir -p test-results/resident-ci
          sha256sum "$source/bun.lock" > test-results/resident-ci/sdk-lock.sha256
          (cd "$source" && bun --no-env-file pm ls --all) > test-results/resident-ci/sdk-graph-before.txt
          python3 -c 'from pathlib import Path; assert Path("test-results/resident-ci/sdk-graph-before.txt").stat().st_size <= 16*1024**2'
      - name: Verify the hydrated SDK graph with OS-network-denied frozen install
        if: github.event_name == 'workflow_dispatch'
        run: |
          source="$ALPHA_LOCAL_AGENT_SOURCE_DIR"
          bun_executable="$(command -v bun)"
          # sudo only creates the fresh network namespace. unshare drops to the
          # runner UID/GID BEFORE the pinned Bun process; no token is forwarded.
          # shellcheck disable=SC2016
          python3 scripts/ci/resident-phase.py --name sdk-offline-install --seconds 600 \
            sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            env -i HOME="$HOME" PATH="$PATH" TMPDIR="$RUNNER_TEMP" NO_COLOR=1 \
            BUN_INSTALL_CACHE_DIR="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}" \
            BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
            /bin/sh -c 'cd "$1" && shift && exec "$@"' sh "$source" \
            "$bun_executable" --no-env-file install --offline --frozen-lockfile --ignore-scripts
          sha256sum --check test-results/resident-ci/sdk-lock.sha256
          (cd "$source" && "$bun_executable" --no-env-file pm ls --all) > test-results/resident-ci/sdk-graph-after.txt
          cmp test-results/resident-ci/sdk-graph-before.txt test-results/resident-ci/sdk-graph-after.txt
          bun scripts/prepare-local-agent.ts --source-only
      - name: Qualify the prepared resident source
        env:
          RUN_TURBO_CONCURRENCY: "1"
        run: |
          python3 scripts/ci/resident-phase.py --name device-timing-flow --seconds 600 bun run agent:test-device-timing
          python3 scripts/ci/resident-phase.py --name worker-build --seconds 900 bun run agent:build-workflow-worker
          python3 scripts/ci/resident-phase.py --name native-cloud-routing --seconds 300 bun scripts/test-native-cloud-runtime-config.ts
          python3 scripts/ci/resident-phase.py --name compiler-flow --seconds 600 bun run agent:test-workflow-compiler
          python3 scripts/ci/resident-phase.py --name worker-flow --seconds 600 bun run agent:test-workflow-worker
      - name: Acquire hash-pinned Android Bun with step-only authentication
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/resident-phase.py --name bun-downloads --seconds 600 python3 scripts/ci/acquire-resident-bun.py
      - name: Stage and archive qualified resident runtime
        env:
          RUN_TURBO_CONCURRENCY: "1"
        run: |
          python3 scripts/ci/resident-phase.py --name runtime-stage --seconds 1800 bun run agent:stage-android
          if [ "$ALPHA_APP_UPDATE_CANDIDATE" = "1" ]; then
            bun scripts/stage-embedding-host.ts --verify
          fi
          python3 scripts/ci/resident-phase.py --name mobile-bundle --seconds 300 bun run agent:test-mobile-workflow-bundle
          # Fresh native artifacts and the runtime pin are inputs to shipped notices.
          python3 scripts/ci/resident-phase.py --name license-notices --seconds 120 bun scripts/generate-licenses.ts --packaged-runtime
          # Flag-off distribution: release verification requires the PACKAGED runtime.
          python3 scripts/ci/resident-phase.py --name distribution-archive --seconds 3000 bun scripts/build-archive.ts test-results/resident-ci-distribution
      - name: Retain bounded distribution producer evidence
        if: github.event_name == 'workflow_dispatch' || env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        run: |
          bun scripts/runtime-profile.ts --verify-native
          bun scripts/prepare-local-agent.ts --source-only
          sha256sum --check test-results/resident-ci/sdk-lock.sha256
          (cd "$ALPHA_LOCAL_AGENT_SOURCE_DIR" && bun --no-env-file pm ls --all) > test-results/resident-ci/sdk-graph-final.txt
          cmp test-results/resident-ci/sdk-graph-before.txt test-results/resident-ci/sdk-graph-final.txt
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil, stat
          from pathlib import Path
          root = Path.cwd().resolve()
          out = root / 'test-results/resident-ci-distribution/producer-evidence'
          archive = out.parent
          generated_manifest = 'android/app/build/generated/local-agent/source-manifest.json'
          version = int(os.environ['ELIZAOS_VERSION_CODE'])
          build_config = (root / 'artifacts/build-config.json').read_bytes()
          build = json.loads(build_config)
          channel = build['updateChannel']
          assert channel['kind'] == 'public', 'The hosted archive must record the public update channel'
          assert (
              build['testMocks'] is False
              and build['runtimeProfile'] == 'native'
              and build['signingRequested'] is False
              and build['versionOverride']['code'] == str(version)
          ), 'Producer configuration differs from the unsigned distribution build'
          verification = (archive / 'apk-verification.json').read_bytes()
          verified = json.loads(verification)
          for record in (json.loads((archive / 'configuration.json').read_text()), verified):
              assert (
                  record['testMocks'] is False
                  and record['runtimeProfile'] == 'native'
                  and record['updateChannel'] == channel
              ), 'Producer configuration differs from the distribution archive'
          releases = [row for row in verified['results'] if row['mode'] == 'release']
          assert len(releases) == 2 and {row['variant'] for row in releases} == {'launcher', 'standalone'}, 'Distribution archive must contain both release variants'
          archived_apks = json.loads((archive / 'apk-manifest.json').read_text())
          for row in releases:
              name = f"{row['variant']}-release-unsigned.apk"
              assert (
                  row['signed'] is False
                  and row['versionCode'] == version
                  and row['file'] == f'artifacts/{name}'
                  and row['sha256'] == archived_apks[name]
              ), 'Producer version or APK differs from the unsigned distribution archive'
          snapshot = json.loads((archive / 'inputs-after.json').read_text())
          out.mkdir(mode=0o700, exist_ok=False)
          inputs = [
              ('artifacts/build-config.json', 'artifacts/build-config.json'),
              ('artifacts/apk-manifest.json', 'artifacts/apk-manifest.json'),
              ('artifacts/sbom', 'artifacts/sbom'),
              ('apps/app/public/licenses', 'apps/app/public/licenses'),
              ('licenses', 'licenses'),
              ('android/app/src/main/assets/agent', 'android/app/src/main/assets/agent'),
              ('android/app/src/main/jniLibs', 'android/app/src/main/jniLibs'),
              (generated_manifest, 'native-source-manifest.json'),
              (str(Path(os.environ['ALPHA_LOCAL_AGENT_SOURCE_DIR']) / '.alpha-runtime-source.json'), 'prepared-source-stamp.json'),
              (str(Path(os.environ['ALPHA_WORKFLOW_WORKER_OUTPUT']) / 'manifest.json'), 'worker-manifest.json'),
          ]
          files, total = {}, 0
          for source, destination in inputs:
              source = root / source
              assert source.exists() and not source.is_symlink() and source.resolve().is_relative_to(root), 'Missing/outside/symlink producer evidence'
              paths = sorted(source.rglob('*')) if source.is_dir() else [source]
              for file in paths:
                  info = file.lstat()
                  assert not stat.S_ISLNK(info.st_mode), 'Evidence symlink'
                  if stat.S_ISDIR(info.st_mode):
                      continue
                  assert stat.S_ISREG(info.st_mode), 'Evidence special file'
                  relative = Path(destination) / file.relative_to(source) if source.is_dir() else Path(destination)
                  assert str(relative) not in files, 'Duplicate producer evidence'
                  total += info.st_size
                  assert total <= 512 * 1024**2 and len(files) < 4096, 'Producer evidence bound exceeded'
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with file.open('rb') as src, target.open('xb') as dst:
                      shutil.copyfileobj(src, dst)
                  with target.open('rb') as copy, file.open('rb') as original:
                      digest = hashlib.file_digest(copy, 'sha256').hexdigest()
                      assert digest == hashlib.file_digest(original, 'sha256').hexdigest(), 'Evidence changed during retention'
                  frozen = snapshot['files'].get(file.resolve().relative_to(root).as_posix())
                  assert frozen is None or digest == frozen, 'Evidence differs from frozen build input'
                  files[str(relative)] = {'bytes': info.st_size, 'sha256': digest}
          assert files['artifacts/apk-manifest.json']['sha256'] == hashlib.sha256(verification).hexdigest(), 'Captured APK verification differs from the distribution archive'
          assert files['artifacts/build-config.json']['sha256'] == hashlib.sha256(build_config).hexdigest(), 'Producer configuration changed during retention'
          assert files['native-source-manifest.json']['sha256'] == snapshot['files'][generated_manifest], 'Captured native source manifest differs from the distribution inputs'
          (out / 'manifest.json').write_text(json.dumps({'source': os.environ['GITHUB_SHA'], 'runtimeProfile': 'native', 'updateChannel': channel, 'versionCode': version, 'bytes': total, 'files': files}, indent=2) + '\n')
          PYCODE
      - name: Archive the isolated test-mocks build
        env:
          RUN_TURBO_CONCURRENCY: "1"
        run: |
          # The native suites need the private peer fixture, a debug-only test hook
          # that exists only in the separate, never-distributable test-mocks build.
          python3 scripts/ci/resident-phase.py --name archive --seconds 3000 bun scripts/build-archive.ts --test-mocks test-results/resident-ci-archive
      - name: Bind the unsigned native candidate to the genuine distribution archive
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp test-results/resident-ci-native-inputs/admission.json test-results/resident-ci-distribution/native-input-admission.json
          bun scripts/app-update-candidate.ts receipt test-results/resident-ci-candidate/version.json test-results/resident-ci-distribution
      - name: Retain the unsigned native update candidate separately from test mocks
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: native-candidate
        with:
          name: app-native-candidate-${{ github.run_number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/resident-ci-distribution/
          retention-days: 3
          if-no-files-found: error
      - name: Record the uploaded automatic candidate archive size
        if: env.ALPHA_APP_UPDATE_CANDIDATE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_CANDIDATE_ARTIFACT_ID: ${{ steps.native-candidate.outputs.artifact-id }}
          ALPHA_CANDIDATE_ARTIFACT_SHA256: ${{ steps.native-candidate.outputs.artifact-digest }}
        run: bun scripts/app-update-candidate.ts archive-size test-results/resident-ci/native-candidate-artifact.json test-results/resident-ci-distribution
      - name: Build and anchor private endpoint helper
        run: python3 scripts/ci/build-private-peer.py
      - name: Preserve native generated provenance
        run: cp android/app/build/generated/local-agent/source-manifest.json test-results/resident-ci-archive/native-generated-source-manifest.json
      - name: Anchor exact archive manifest
        id: freeze
        run: echo "sha256=$(sha256sum test-results/resident-ci-archive/apk-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # build-archive.ts retains each release R8 mapping (<variant>-release-mapping.txt,
      # hashed in release-mappings.json) beside the APKs, so both archives carry them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: apks
        with:
          name: resident-archive-${{ github.sha }}-${{ github.run_id }}
          path: test-results/resident-ci-archive/
          retention-days: 3
          if-no-files-found: error
      # Preserve the dispatched artifact name for existing reviewed signing plans.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: resident-distribution-archive-${{ github.sha }}-${{ github.run_id }}
          path: test-results/resident-ci-distribution/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 3
          name: resident-build-evidence-${{ github.run_id }}
          path: |
            test-results/resident-ci-supervisor/
            test-results/resident-ci/
            test-results/resident-ci-distribution/
            android/app/build/reports/
  native:
    needs: build
    if: (github.event_name != 'workflow_dispatch' || inputs.operation == 'build' || inputs.operation == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ALPHA_RESIDENT_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      # Fresh native job has its own stock hosted image; build-job cleanup does
      # not carry over. Provision before tools, artifacts or the AVD are created.
      - name: Provision native capacity on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # Fixed unused language installations only; preserve every Android SDK,
          # source checkout, dependency cache and downloaded build artifact.
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            test ! -L "$unused"
            if [ -e "$unused" ]; then
              test -d "$unused"
              test "$(realpath "$unused")" = "$unused"
            fi
          done
          python3 -c 'import shutil; print("nativeFreshCapacityBeforeBytes="+str(shutil.disk_usage(".").free))'
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("nativeFreshCapacityAfterBytes="+str(free)); assert free >= 24*1024**3, "Fresh native runner needs 24GiB before SDK, archive and AVD provisioning"'
          # Existing 10GiB admission and 4GiB runtime floor remain unchanged.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install exact APK inspection tools
        run: sdkmanager "build-tools;36.0.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: test-results/resident-ci-archive
          merge-multiple: true
      - name: Require fresh capacity and KVM
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 python3 scripts/ci/resident-phase.py --name prepare-phone --seconds 300 bun scripts/prepare-ci-emulator.ts
            ANDROID_SERIAL=emulator-5554 ALPHA_RESIDENT_DISPOSABLE_CI=1 python3 scripts/ci/resident-phase.py --name native --seconds 5400 python3 scripts/ci/resident-native.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 3
          name: resident-native-evidence-${{ github.run_id }}
          path: |
            test-results/resident-ci-supervisor/
            test-results/resident-ci/
            test-results/resident-ci-native/

