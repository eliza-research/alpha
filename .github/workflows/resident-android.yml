name: Resident Android exact source

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build APKs or publish only a reviewed embedding qualification
        type: choice
        required: false
        default: build
        options:
          - build
          - publish-qualification
      qualification_carrier:
        description: Upload-only JSON with commit, qualification_sha256, semantic_sha256
        type: string
        required: false
      embedding_component_artifact_id:
        description: Exact reviewed compiled component artifact ID
        type: string
        required: false
      embedding_component_sha256:
        description: SHA-256 of the compiled component artifact archive
        type: string
        required: false
      build_version_code:
        description: Dispatched build versionCode (25..2100000000), recorded in the producer evidence
        type: string
        required: true
        default: '122'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: resident-${{ github.event_name == 'push' && format('app-candidate-run-{0}', github.run_id) || github.ref }}${{ inputs.operation == 'publish-qualification' && '-carrier' || '' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  publish-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-qualification'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/embedding-qualification-carrier.yml
    with:
      carrier_json: ${{ inputs.qualification_carrier }}
      component_artifact_id: ${{ inputs.embedding_component_artifact_id }}
      component_sha256: ${{ inputs.embedding_component_sha256 }}

  build:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'push' || inputs.operation == 'build' || inputs.operation == ''
    env:
      ALPHA_APP_UPDATE_CANDIDATE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
      ELIZAOS_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_version_code || github.run_number }}
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_LATEST_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android native toolchain
        timeout-minutes: 20
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          printf '%s\n' "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Provision build capacity on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then sudo rm -rf -- "$unused"; fi
          done
          df -h "$GITHUB_WORKSPACE"
      - name: Install speech model converter dependencies
        run: |
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'
          python3 -m pip install 'numpy==2.2.6' 'zstandard==0.23.0' 'librosa==0.11.0' 'onnx==1.21.0' 'PyYAML==6.0.2' 'tqdm==4.67.1' 'requests==2.34.2'
      - uses: ./.github/actions/setup
        with:
          job: resident-android
          verification: "false"
      - name: Verify zero Bun and signer record
        run: |
          pnpm no-bun
          python3 scripts/ci/app_update_producer.py signer-record apps/app/aosp/signing/release-signer.json
      - name: Prove offline pnpm workspace graph from restored store
        run: pnpm install --frozen-lockfile --offline
      - name: Prepare pinned Eliza checkout and verify Android inputs and notices
        run: |
          pnpm eliza
          pnpm --filter @repo/app licences --check
          pnpm --filter @repo/app android inputs
      - name: Build and verify the resident launcher candidate APKs
        env:
          TELEGRAM_API_ID: ${{ vars.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: pnpm --filter @repo/app android build --release
      - name: Prepare verified Robolectric Android 35 framework jar
        run: bash scripts/ci/prepare-robolectric-android.sh "${HOME}/.m2/repository"
      - name: Run Alpha native JVM unit tests
        timeout-minutes: 15
        working-directory: apps/app/android
        run: |
          eliza_pin=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/eliza.lock.json").commit')
          engine_pin=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/.eliza/packages/os/android/local-inference/engine.lock.json").engine.commit')
          ./gradlew --no-daemon \
            "-PelizaInferenceEngineDir=$PWD/.cache/voice-engine/$engine_pin" \
            "-PelizaParadeeNativeDir=$PWD/.cache/voice/$eliza_pin" \
            -PelizaSpeechBridgeCapacitor=true :app:testLauncherDebugUnitTest
      - uses: actions/upload-artifact@v5
        with:
          name: app-native-candidate-${{ env.ELIZAOS_VERSION_CODE }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/app/artifacts/*.apk
            apps/app/artifacts/*.json
            apps/app/artifacts/mapping/*.txt
            apps/app/artifacts/sbom/*.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
