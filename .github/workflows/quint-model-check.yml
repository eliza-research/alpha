name: Quint model checking
# Formal checks for promoting develop to main: the Quint gate and its node tests, source
# refinement, bounded symbolic checking, the historical comparisons and temporal properties,
# and the LemmaScript proofs. Nothing here runs on pull requests into develop or on pushes;
# authors run `npm run quint:check`, `npm run quint:tests` and `npm run lemma:check` locally.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated module names for symbolic checking (empty checks every model)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: quint-model-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Bounded symbolic safety
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run upstream:prepare-client
      - name: Bounded symbolic safety and additional proof inits
        env:
          MODELS: ${{ inputs.models }}
        run: npm run quint:verify -- --steps=6 ${MODELS:+--models=$MODELS}
      # Each module named below must declare currentChecks or currentTemporalChecks in specs/quint/legacy/manifest.json;
      # the runner rejects an unknown module and a selection without comparisons.
      - name: Expected counterexamples and current-design comparisons
        if: ${{ !inputs.models }}
        run: npm run quint:compare -- --backend=tlc --models=ChatInput,SettingsNav,HomeLayout,GoogleConnect
      # Each module named below must declare temporal properties in specs/quint/legacy/manifest.json.
      - name: Fairness-guarded temporal properties
        if: ${{ !inputs.models }}
        run: npm run quint:temporal -- --backend=tlc --models=SignIn,GoogleConnect,Maps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quint-model-check
          path: test-results/quint/
  conformance:
    name: Quint gate, source refinement and function proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - name: Install browser for source-refinement checks
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned JSON dependency for native refinement
        shell: bash
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Prepare reviewed Kotlin compiler for native refinement
        run: node test/fixtures/kotlin-tools.mjs --prepare
      - name: Prepare hash-pinned Dafny function verifier
        run: bash scripts/ci/prepare-dafny.sh
      - name: Prepare pinned SDK for refinement against the real runtime
        shell: bash
        run: |
          export ALPHA_BUN="$(command -v bun)"
          test "$("$ALPHA_BUN" --version)" = '1.4.2'
          node scripts/prepare-local-agent.ts
          prepared_source=$(node --input-type=module -e "import {sourceDirectory,verifySource} from './scripts/local-agent-source.ts'; import fs from 'node:fs'; const source=sourceDirectory(process.cwd()); verifySource(source,JSON.parse(fs.readFileSync('upstream.lock.json','utf8')).commit); process.stdout.write(source);")
          echo "ALPHA_BUN=$ALPHA_BUN" >> "$GITHUB_ENV"
          echo "ALPHA_CLOUD_COLLECTOR_SOURCE=$prepared_source" >> "$GITHUB_ENV"
      - run: npm run upstream:prepare-client && npm run quint:prepare-history
      - name: Typecheck, scenarios and sampled simulation of every model
        run: npm run quint:check
      - name: Function proofs
        env:
          LEMMA_REQUIRE_BACKEND: '1'
        run: npm run lemma:check
      - name: Quint node tests
        env:
          ALPHA_REQUIRE_PREPARED_SDK: '1'
          ALPHA_ELIZA_SOURCE: ${{ env.ALPHA_CLOUD_COLLECTOR_SOURCE }}
          ALPHA_QUINT_BUN: ${{ env.ALPHA_BUN }}
          # Give each aggregate the runner's resources; retain every test and deadline.
          ALPHA_TEST_CONCURRENCY: '1'
        run: npm run quint:tests
      - name: Check composed source transitions against Quint
        run: npm run quint:refinement -- --families=composition --out=test-results/quint-refinement/composition-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quint-verification
          path: |
            test-results/quint/
            test-results/quint-refinement/
            test-results/lemma/
          retention-days: 7
