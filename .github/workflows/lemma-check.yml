name: LemmaScript proofs
# Function-level Dafny proofs for the annotated TypeScript listed in LemmaScript-files.txt.
# `bun run verify` runs the same check but records a skip when no Dafny is installed; this job installs the
# pinned backend and requires it, so a skipped check cannot stand in for a proof.
on:
  pull_request:
    paths:
      - apps/app/src/**
      - specs/lemma/**
      - scripts/check-lemma.ts
      - LemmaScript-files.txt
      - lemmascript.json
      - bun.lock
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lemma-check-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  proofs:
    name: Dafny proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run upstream:prepare-client
      # The checker and LemmaScript run `dafny` from PATH; the shared script pins the
      # same archive hash and puts the verified binary on PATH.
      - name: Install the pinned Dafny release
        run: bash scripts/ci/prepare-dafny.sh
      - name: Check every listed proof
        env:
          LEMMA_REQUIRE_BACKEND: '1'
        run: bun run lemma:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lemma-check
          path: test-results/lemma/
