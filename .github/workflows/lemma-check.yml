name: LemmaScript proofs
# Function-level Dafny proofs for the annotated TypeScript listed in LemmaScript-files.txt.
# `bun run verify` runs the same check but records a skip when no Dafny is installed; this job installs the
# pinned backend and requires it, so a skipped check cannot stand in for a proof.
on:
  pull_request:
    paths:
      - apps/app/src/**
      - specs/lemma/**
      - scripts/check-lemma.ts
      - LemmaScript-files.txt
      - lemmascript.json
      - bun.lock
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lemma-check-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  proofs:
    name: Dafny proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAFNY_VERSION: 4.11.0
      DAFNY_SHA256: a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run upstream:prepare-client
      - name: Install the pinned Dafny release
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/dafny.zip" "https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          echo "${DAFNY_SHA256}  $RUNNER_TEMP/dafny.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP"
          echo "DAFNY=$RUNNER_TEMP/dafny/dafny" >> "$GITHUB_ENV"
      - name: Check every listed proof
        env:
          LEMMA_REQUIRE_BACKEND: '1'
        run: bun run lemma:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lemma-check
          path: test-results/lemma/
